# SOLVAREN console — static hosting.
#
# These headers were previously declared in `apps/web/public/_headers`, which only
# Cloudflare Pages reads. That file is now inert, so the hardening lives here instead.
# Losing it silently was the most likely way for this migration to weaken the product, so
# `scripts/check-invariants.sh` asserts every directive below is present.

server {
    # Railway injects PORT; the entrypoint substitutes it into this template.
    listen       ${PORT};
    server_name  _;
    root         /usr/share/nginx/html;

    # Do not advertise the server version.
    server_tokens off;

    add_header X-Content-Type-Options    "nosniff"                     always;
    add_header X-Frame-Options           "DENY"                        always;
    add_header Referrer-Policy           "no-referrer"                 always;
    # One directive only: a second Permissions-Policy header replaces the first rather than
    # merging, which would silently drop the camera and microphone restrictions.
    # `publickey-credentials-get=(self)` is required for the WebAuthn release ceremony.
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), publickey-credentials-get=(self)" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                always;
    # frame-ancestors only takes effect as a response header, never from a <meta> tag.
    add_header Content-Security-Policy   "frame-ancestors 'none'"      always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The application shell must never be cached: a stale bundle against a new API is how a
    # release ceremony breaks halfway through.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "DENY" always;
        add_header Referrer-Policy           "no-referrer" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), publickey-credentials-get=(self)" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Content-Security-Policy   "frame-ancestors 'none'" always;
    }

    # Hashed assets are immutable by construction.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Single-page application: every unmatched path renders the shell, which reads the
    # hash route.
    #
    # There is no /api proxy here, unlike the Cloudflare Pages `_redirects` this replaces.
    # The console talks to the API service directly at VITE_API_BASE_URL, cross-origin, and
    # the API's CORS middleware admits exactly one origin — APP_ORIGIN. That is a real
    # difference from the previous same-origin setup: it means a preflight on some payment
    # paths, and it means APP_ORIGIN on the API must match this service's public URL
    # exactly or every request fails.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
