#
# SOLVAREN Payment Solutions — API Worker
#
# One Worker serves the HTTP API, the queue consumers and the scheduled jobs. They share
# the domain code, so a reconciliation sweep cannot drift from the rules the API enforces.
#
# Secrets are NEVER declared here. They are set with `wrangler secret put` (or through the
# Cloudflare Secrets Store) and arrive as bindings at runtime — spec 8.4 and NFR-SEC-003.
# See docs/deployment.md for the full list and the order to set them in.
#

name = "solvaren-api"
main = "src/index.ts"
compatibility_date = "2025-01-15"
# `nodejs_compat` supplies Buffer and node:crypto shims used by @simplewebauthn and the
# postgres driver. Argon2id comes from hash-wasm (WebAssembly), not a native module.
compatibility_flags = ["nodejs_compat"]

workers_dev = false
# The Worker holds database connections and calls Daraja; observability is how a stuck
# payroll gets diagnosed at 06:00.
[observability]
enabled = true
head_sampling_rate = 1.0

[placement]
# Keep the isolate close to the database rather than to the user: every request makes
# several round trips to PostgreSQL and at most one to Daraja.
mode = "smart"

# ---------------------------------------------------------------------------
# Scheduled jobs
# ---------------------------------------------------------------------------
[triggers]
crons = [
  "*/5 * * * *",  # reconciliation and status sweeps (TRK-008)
  "0 * * * *",    # backup schedules, including missed-window detection (spec 13.4)
  "0 2 * * *",    # housekeeping: expire stale ceremonies and sessions
]

# ===========================================================================
# Production
# ===========================================================================
[env.production]
name = "solvaren-api"
routes = [{ pattern = "api.solvaren.co.ke", custom_domain = true }]

[env.production.vars]
ENVIRONMENT = "production"
APP_ORIGIN = "https://app.solvaren.co.ke"
API_BASE_URL = "https://api.solvaren.co.ke"
WEBAUTHN_RP_ID = "solvaren.co.ke"
WEBAUTHN_RP_NAME = "SOLVAREN Payment Solutions"
DARAJA_ENVIRONMENT = "production"
AI_MODEL = "claude-sonnet-5"

# Managed PostgreSQL through Hyperdrive. The database is never exposed to the public
# internet (spec 16.1); Hyperdrive is the only path in.
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_PRODUCTION_HYPERDRIVE_ID"

# Producers ----------------------------------------------------------------
[[env.production.queues.producers]]
binding = "PAYMENT_QUEUE"
queue = "solvaren-payments"

[[env.production.queues.producers]]
binding = "CALLBACK_QUEUE"
queue = "solvaren-callbacks"

[[env.production.queues.producers]]
binding = "RECONCILIATION_QUEUE"
queue = "solvaren-reconciliation"

[[env.production.queues.producers]]
binding = "BACKUP_QUEUE"
queue = "solvaren-backups"

# Consumers ----------------------------------------------------------------
# Payment execution is deliberately the most conservative consumer on the platform.
[[env.production.queues.consumers]]
queue = "solvaren-payments"
# Small batches and low concurrency keep submission throughput inside the Daraja TPS
# contract; exceeding it returns 500.003.03 and buys nothing.
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 3
# Three attempts, then dead-letter. A payment is never retried into an unknown outcome —
# the executor reconciles instead (spec 9.3) — so retries here only cover failures that
# provably never reached M-PESA.
max_retries = 3
dead_letter_queue = "solvaren-payments-dlq"

[[env.production.queues.consumers]]
queue = "solvaren-callbacks"
max_batch_size = 25
max_batch_timeout = 2
max_concurrency = 10
max_retries = 5
dead_letter_queue = "solvaren-callbacks-dlq"

[[env.production.queues.consumers]]
queue = "solvaren-reconciliation"
max_batch_size = 10
max_batch_timeout = 10
max_concurrency = 2
max_retries = 3
dead_letter_queue = "solvaren-reconciliation-dlq"

[[env.production.queues.consumers]]
queue = "solvaren-backups"
# A backup snapshot is long-running and memory-hungry: one at a time.
max_batch_size = 1
max_batch_timeout = 30
max_concurrency = 1
max_retries = 2
dead_letter_queue = "solvaren-backups-dlq"

# R2 — backups, encrypted secret envelopes and generated artefacts.
[[env.production.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "solvaren-artifacts"

# Durable Object for per-organisation submission rate limiting.
[[env.production.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "OrganizationRateLimiter"

[[env.production.migrations]]
tag = "v1"
new_sqlite_classes = ["OrganizationRateLimiter"]

# ===========================================================================
# Staging
# ===========================================================================
[env.staging]
name = "solvaren-api-staging"
routes = [{ pattern = "api-staging.solvaren.co.ke", custom_domain = true }]

[env.staging.vars]
ENVIRONMENT = "staging"
APP_ORIGIN = "https://app-staging.solvaren.co.ke"
API_BASE_URL = "https://api-staging.solvaren.co.ke"
WEBAUTHN_RP_ID = "solvaren.co.ke"
WEBAUTHN_RP_NAME = "SOLVAREN Payment Solutions (Staging)"
# Staging never touches the production M-PESA shortcode. A staging deployment that could
# disburse real money is not a staging deployment.
DARAJA_ENVIRONMENT = "sandbox"
AI_MODEL = "claude-sonnet-5"

[[env.staging.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_STAGING_HYPERDRIVE_ID"

[[env.staging.queues.producers]]
binding = "PAYMENT_QUEUE"
queue = "solvaren-payments-staging"

[[env.staging.queues.producers]]
binding = "CALLBACK_QUEUE"
queue = "solvaren-callbacks-staging"

[[env.staging.queues.producers]]
binding = "RECONCILIATION_QUEUE"
queue = "solvaren-reconciliation-staging"

[[env.staging.queues.producers]]
binding = "BACKUP_QUEUE"
queue = "solvaren-backups-staging"

[[env.staging.queues.consumers]]
queue = "solvaren-payments-staging"
max_batch_size = 10
max_batch_timeout = 5
max_concurrency = 2
max_retries = 3
dead_letter_queue = "solvaren-payments-staging-dlq"

[[env.staging.queues.consumers]]
queue = "solvaren-callbacks-staging"
max_batch_size = 25
max_batch_timeout = 2
max_concurrency = 5
max_retries = 5
dead_letter_queue = "solvaren-callbacks-staging-dlq"

[[env.staging.queues.consumers]]
queue = "solvaren-reconciliation-staging"
max_batch_size = 10
max_batch_timeout = 10
max_concurrency = 2
max_retries = 3
dead_letter_queue = "solvaren-reconciliation-staging-dlq"

[[env.staging.queues.consumers]]
queue = "solvaren-backups-staging"
max_batch_size = 1
max_batch_timeout = 30
max_concurrency = 1
max_retries = 2
dead_letter_queue = "solvaren-backups-staging-dlq"

[[env.staging.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "solvaren-artifacts-staging"

[[env.staging.durable_objects.bindings]]
name = "RATE_LIMITER"
class_name = "OrganizationRateLimiter"

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["OrganizationRateLimiter"]
